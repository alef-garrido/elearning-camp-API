server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  location / {
    # Fallback all requests to index.html for SPA routing
    try_files $uri $uri/ /index.html;
    
    # Prevent caching of index.html itself
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Cache static assets with content hash (Vite adds hash to filenames)
  location ~* \.[a-zA-Z0-9]{8}\.(js|css|png|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fallback cache headers for other assets
  location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  # Deny access to hidden files
  location ~ /\. {
    deny all;
  }
}
